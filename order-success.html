<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order confirmed | Dominion Books</title>
    <meta name="description" content="Thank you for ordering Adam’s Lost Dominion." />
    <meta property="og:image" content="/assets/og-share.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/brand-mark.png" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" data-chrome="header"></header>
    <main>
      <section class="page-hero">
        <div class="page-hero-media" aria-hidden="true">
          <img src="/assets/hero-wonder-1.jpg" alt="" />
          <div class="page-hero-veil"></div>
        </div>
        <div class="page-hero-inner reveal">
          <p class="eyebrow">Payment received</p>
          <h1>Thank you</h1>
          <p id="success-copy">
            Your paperback order is confirmed. Howard will pack and ship via US Media Mail. A PayPal
            receipt was also emailed to you.
          </p>
          <div class="page-actions">
            <a class="btn btn-primary" href="/">Back home</a>
            <a class="btn btn-outline" href="/sample.html">Read a sample</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-chrome="footer"></footer>
    <script type="module">
      import { boot } from '/src/main.js'
      boot('order')
      const params = new URLSearchParams(location.search)
      const id = params.get('token') || params.get('orderId')
      if (id) {
        const el = document.querySelector('#success-copy')
        if (el) {
          el.textContent = `Your paperback order is confirmed (PayPal ref ${id}). Howard will pack and ship via US Media Mail. A PayPal receipt was also emailed to you.`
        }
      }
    </script>
  </body>
</html>
