<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Pages | Dominion Books</title>
    <meta
      name="description"
      content="Read a sample of Adam’s Lost Dominion — covers and introduction pages before you buy."
    />
    <meta property="og:image" content="/assets/og-share.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/brand-mark.png" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" data-chrome="header"></header>

    <main>
      <section class="page-hero">
        <div class="page-hero-inner">
          <p class="eyebrow">Read before you buy</p>
          <h1>Sample pages</h1>
          <p>Front and back covers, plus the introduction — enough to feel the voice of the book.</p>
        </div>
      </section>

      <section class="section">
        <div class="section-inner">
          <div class="sample-viewer">
            <button type="button" class="sample-nav prev" id="sample-prev" aria-label="Previous page">‹</button>
            <div class="sample-stage">
              <img id="sample-page" src="/assets/cover-front.jpg" alt="Sample page" />
            </div>
            <button type="button" class="sample-nav next" id="sample-next" aria-label="Next page">›</button>
          </div>
          <div class="sample-meta">
            <span id="sample-label">Front cover</span>
            <div class="sample-dots" id="sample-dots" role="tablist" aria-label="Sample pages"></div>
          </div>
          <div class="page-actions" style="margin-top: 2rem">
            <a class="btn btn-primary" href="/order.html">Order the paperback</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-chrome="footer"></footer>
    <script type="module">
      import { boot } from '/src/main.js'
      boot('sample')
    </script>
  </body>
</html>
