<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout canceled | Dominion Books</title>
    <meta name="description" content="PayPal checkout was canceled. You can try again anytime." />
    <meta property="og:image" content="/assets/og-share.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/brand-mark.png" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" data-chrome="header"></header>
    <main>
      <section class="page-hero">
        <div class="page-hero-media" aria-hidden="true">
          <img src="/assets/hero-wonder-2.jpg" alt="" />
          <div class="page-hero-veil"></div>
        </div>
        <div class="page-hero-inner reveal">
          <p class="eyebrow">No charge made</p>
          <h1>Checkout canceled</h1>
          <p>
            You left PayPal before finishing. Nothing was charged. When you’re ready, return to the
            order page and try again.
          </p>
          <div class="page-actions">
            <a class="btn btn-primary" href="/order.html">Return to order</a>
            <a class="btn btn-outline" href="/">Home</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-chrome="footer"></footer>
    <script type="module">
      import { boot } from '/src/main.js'
      boot('order')
    </script>
  </body>
</html>
